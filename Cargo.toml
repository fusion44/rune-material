[package]
name = "rune-material"
version = "0.1.0"
edition = "2024"
description = "Material 3 tokens and components for Rune"
license = "Apache-2.0"
repository = "https://github.com/fusion44/rune-material"
publish = false
autoexamples = false
include = ["src/**", "assets/material-symbols/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606", features = ["tooling"] }
serde_json = "1"

# Rune's workspace patches must also be applied by downstream workspace roots.
# Keep its platform and text fixes pinned to the same revision as Rune.
[patch.crates-io]
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }
winit = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "0796df5fa269b85d4fc04786bbd37f7349eb6606" }

[[bin]]
name = "gallery"
path = "examples/gallery/main.rs"

[[bin]]
name = "dms-theme"
path = "examples/dms_theme/main.rs"

[[bin]]
name = "calculator"
path = "examples/calculator/main.rs"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
